<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nikhil Yadav: from Android apps to AI agent workflows, idea to production.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nikhil Yadav">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nikhil Yadav · Android Apps & AI Agents</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start the slow downloads early: the app code now, and connections to
       the graphics engine (gstatic), Google Fonts and the mascot renderer. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Splash: plain HTML, so it paints immediately instead of a blank page
       while Flutter downloads (~3 MB). Same sky as the Midday mood, so the
       hand-off to the app is seamless. Removed on Flutter's first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #2b74c4; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px;
      background: linear-gradient(110deg, #2196f3 0%, #4f7fb0 55%, #8a8f97 100%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff; transition: opacity .35s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .mark {
      width: 72px; height: 72px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.45);
      font-weight: 700; font-size: 26px; letter-spacing: -.5px;
    }
    #splash .name { font-size: 15px; font-weight: 600; opacity: .92; }
    #splash .bar {
      width: 140px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(255,255,255,.22);
    }
    #splash .bar i {
      display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #fff; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); }
                       to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar i { animation: none; width: 100%; opacity: .6; }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- Mascot bridge: defines window.nyMascot before the app starts. -->
  <script src="mascot/mascot.js"></script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="splash" aria-label="Loading">
    <div class="mark">NY</div>
    <div class="name">Nikhil Yadav</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    // Fade the splash out once Flutter has painted its first frame.
    function hideSplash() {
      var s = document.getElementById('splash');
      if (!s || s.classList.contains('gone')) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 400);
    }
    window.addEventListener('flutter-first-frame', hideSplash);
  </script>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            return appRunner.runApp();
          }).then(function() {
            // Safety net: never leave the splash over a running app, even
            // if the first-frame event is missed.
            setTimeout(hideSplash, 2000);
          });
        }
      });
    });
  </script>
</body>
</html>
