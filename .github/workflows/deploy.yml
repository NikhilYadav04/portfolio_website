name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Weekly rebuild so the contribution graph stays current between pushes.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Refresh GitHub contributions
        # Real data for the contribution graph. Only replaces the committed
        # snapshot in assets/data/ when the response is valid, so a failed
        # fetch never ships an empty or broken graph.
        run: |
          if curl -sf --max-time 30                "https://github-contributions-api.jogruber.de/v4/NikhilYadav04?y=last"                -o /tmp/contributions.json              && jq -e '.contributions | length > 0' /tmp/contributions.json > /dev/null; then
            mv /tmp/contributions.json assets/data/contributions.json
            echo "Contributions refreshed."
          else
            echo "::warning::Contribution refresh failed; shipping the committed snapshot."
          fi

      - name: Build web
        # Custom domain (nikhil.runs-on.dev) serves from the root, so the
        # base href is "/". It would be "/portfolio_website/" only if the
        # site were served from the github.io project-page path.
        run: flutter build web --release --base-href "/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload ONLY build/web — nothing else
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
